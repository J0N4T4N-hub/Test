function sheet(id){const h=`<div><div class="row2" style="margin-bottom:8px"><b style="font-size:18px">Adicionar à playlist</b><button data-x>${ic('down')}</button></div>
<div class="song" data-np="${esc(id)}"><div class="cv" style="width:48px;height:48px">${ic('plus')}</div><div class="i">Nova playlist</div></div>
<div class="song" data-fv="${esc(id)}"><div class="cv" style="width:48px;height:48px">${ic('heart',st.fav.includes(id))}</div><div class="i">${st.fav.includes(id)?'Remover dos favoritos':'Favoritar'}</div></div>
${st.pls.map(p=>`<div class="song" data-ap="${p.id}" data-id="${esc(id)}"><div class="cv" style="width:48px;height:48px">${p.img?`<img src="${p.img}">`:ic('list')}</div><div class="i"><div class="t">${esc(p.name)}</div><div class="sub">${p.ids.includes(id)?'Já está nesta playlist':p.ids.length+' músicas'}</div></div></div>`).join('')}</div>`;
$('sheet').innerHTML=h;$('sheet').classList.add('o')}
function newPl(id){const n=(prompt('Nome da playlist')||'').trim();if(!n)return;if(!st.pl[n])st.pl[n]=[];if(id&&!st.pl[n].includes(id))st.pl[n].push(id);save();$('sheet').classList.remove('o');render();toast('Playlist “'+n+'” pronta')}
/* ---------- editor de playlist ---------- */
const PL=id=>st.pls.find(p=>p.id==id);let ED=null;
function edOpen(id,pre){const p=id&&PL(id);ED={id:id||null,name:p?p.name:'',img:p?p.img:'',ids:new Set(p?p.ids:(pre?[pre]:[])),q:''};
$('ed').innerHTML=`<div class="row2" style="margin-bottom:14px"><button class="ib" id="edx">${ic('back')}</button><b style="font-size:18px">${p?'Editar playlist':'Nova playlist'}</b><div class="btn" id="eds">Salvar</div></div>
<div id="edi" class="cv" style="width:160px;height:160px;border-radius:16px;margin:0 auto 8px"></div>
<div class="sub" style="text-align:center;margin-bottom:14px">Toque na imagem para escolher a foto</div>
<input class="in" id="edn" placeholder="Nome da playlist" maxlength="40">
<div class="row2" style="margin-bottom:10px"><b id="edc"></b>${p?`<button id="edd" class="sub" style="padding:6px">Excluir playlist</button>`:''}</div>
<input type="search" id="edq" placeholder="Buscar músicas para adicionar"><div id="edl"></div>`;
$('edn').value=ED.name;edImg();edList();$('ed').classList.add('o')}
function edImg(){$('edi').innerHTML=ED.img?`<img src="${ED.img}">`:ic('plus').replace('<svg','<svg style="width:44px;height:44px"')}
function edCount(){$('edc').textContent=ED.ids.size+' músicas selecionadas'}
function edList(){const k=nz(ED.q),l=S.filter(s=>mt(s,k,'all'));
$('edl').innerHTML=l.length?l.map(s=>`<div class="song" data-sel="${esc(s.id)}"><div class="cv">${s.cu?`<img loading="lazy" src="${s.cu}">`:ic('note')}</div><div class="i"><div class="t n">${esc(s.title)}</div><div class="t sub">${esc(s.artist)}</div></div><span class="ck ${ED.ids.has(s.id)?'on':''}">${ic('check')}</span></div>`).join(''):'<div class="empty">Nenhuma música na biblioteca.</div>';edCount()}
$('ed').addEventListener('click',e=>{const t=e.target;
if(t.closest('#edx')){$('ed').classList.remove('o');return}
if(t.closest('#edi')){$('pimg').click();return}
const r=t.closest('[data-sel]');if(r){const id=r.dataset.sel;ED.ids.has(id)?ED.ids.delete(id):ED.ids.add(id);r.querySelector('.ck').classList.toggle('on');edCount();return}
if(t.closest('#edd')){if(confirm('Excluir esta playlist?')){st.pls=st.pls.filter(p=>p.id!=ED.id);save();$('ed').classList.remove('o');sub=null;render()}return}
if(t.closest('#eds')){const n=$('edn').value.trim();if(!n){toast('Dê um nome à playlist');return}
const ids=[...ED.ids];if(ED.id){Object.assign(PL(ED.id),{name:n,img:ED.img,ids})}else{const p={id:'p'+Date.now().toString(36),name:n,img:ED.img,ids};st.pls.push(p);ED.id=p.id}
save();$('ed').classList.remove('o');render();toast('Playlist salva')}});
$('ed').addEventListener('input',e=>{if(e.target.id=='edq'){ED.q=e.target.value;edList()}});
$('pimg').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!ED)return;const u=URL.createObjectURL(f),im=new Image();
im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(im.width,im.height),z=480;c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,z,z);ED.img=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(u);edImg()};im.src=u};
/* ---------- events ---------- */
document.addEventListener('click',e=>{if(e.target.id=='gl'){findLyrics();return}const t=e.target.closest('[data-tab],[data-play],[data-add],[data-g],[data-back],[data-pick],[data-dir],[data-lt],[data-st],[data-all],[data-shuf],[data-new],[data-edit],[data-np],[data-ap],[data-fv],[data-x],[data-ff]');if(!t||t.closest('#full')&&!t.closest('#sheet'))return;
const d=t.dataset;if(d.ff){FF=d.ff;flt();return}
if('dir' in d){$('dir').click();return}
if(d.tab){tab=d.tab=='pls'?'pls':d.tab;sub=null;$('main').scrollTop=0;render();pg(0);return}
if('pick' in d){$('pick').click();return}
if(d.add){e.stopPropagation();sheet(d.add);return}
if(d.play){const l=LISTS[d.l];go(l.findIndex(s=>s.id==d.play),l);if(!$('main').querySelector('.hs'))refreshRows();return}
if(d.g){SP=$('main').scrollTop;sub={g:d.g,k:d.k};render();$('main').scrollTop=0;pg(1);return}
if('back' in d){sub=null;render();$('main').scrollTop=SP;pg(-1);return}
if(d.lt){libTab=d.lt;render();pg(0);return}if(d.st){sort=d.st;render();return}
if(d.all){go(0,LISTS[d.all]);return}
if(d.shuf){shuf=true;const l=LISTS[d.shuf];go(Math.floor(Math.random()*l.length),l);return}
if('new' in d){edOpen();return}
if('edit' in d){edOpen(sub.k);return}
if(d.np){$('sheet').classList.remove('o');edOpen(null,d.np);return}
if(d.fv){const i=st.fav.indexOf(d.fv);i<0?st.fav.push(d.fv):st.fav.splice(i,1);save();$('sheet').classList.remove('o');ui();render();return}
if(d.ap){const p=PL(d.ap);if(p&&!p.ids.includes(d.id))p.ids.push(d.id);save();$('sheet').classList.remove('o');render();toast('Adicionada a “'+(p?p.name:'')+'”');return}
if('x' in d)$('sheet').classList.remove('o')});
$('sheet').addEventListener('click',e=>{if(e.target.id=='sheet')$('sheet').classList.remove('o')});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;flt()}else if(e.target.id=='lf'){FQ=e.target.value;flt()}});
$('dir').onchange=e=>{add([...e.target.files]);e.target.value=''};
$('pick').onchange=e=>{add([...e.target.files]);e.target.value=''};
document.addEventListener('keydown',e=>{if(e.code=='Space'&&e.target.tagName!='INPUT'){e.preventDefault();tog()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});load();ui();
</script></body></html>
